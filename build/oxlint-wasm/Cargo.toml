[package]
name = "friendly_adversary_oxlint_wasm"
version = "1.76.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_ast = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_linter = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc.git", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
json-strip-comments = "=3.1.2"
miette = { package = "oxc-miette", version = "=3.0.1", features = ["fancy-no-syscall"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
